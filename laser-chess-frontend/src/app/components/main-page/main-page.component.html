<div *ngIf="errorMessage" class="status-screen" fxLayout="column" fxLayoutAlign="center center">
  <mat-icon color="warn" class="status-icon">warning</mat-icon>
  <h2 class="status-title">{{ errorMessage }}</h2>
  <p class="status-subtitle">Please try again in a moment.</p>
</div>

<div *ngIf="!errorMessage && !fetched" class="status-screen" fxLayout="column" fxLayoutAlign="center center">
  <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
  <h3 class="status-title">Loading...</h3>
</div>

<div
  *ngIf="!errorMessage && fetched"
  class="main-wrapper"
  fxLayout="column"
  fxLayout.gt-sm="column"
  fxLayoutGap="20px"
  fxLayoutAlign="start stretch"
>
  <div
    *ngIf="!verified && isLoggedin"
    fxLayout="column"
    fxFlexAlign="center"
    fxFlex="20"
    fxLayoutGap="20px"
    fxLayoutAlign="center"
  >
    <!-- <h1 class = "text">You need to verify your account </h1>
  <button  mat-stroked-button (click)="sendVerifyEmail()">Click to send email</button> -->
  </div>
  <div
    *ngIf="verified && isLoggedin"
    fxLayout="column"
    fxFlexAlign="center"
    fxFlex="20"
    fxLayoutGap="20px"
    fxLayoutAlign="center"
  ></div>
  <div
    *ngIf="!isLoggedin"
    fxLayout="column"
    fxFlexAlign="center"
    fxFlex="20"
    fxLayoutGap="20px"
    fxLayoutAlign="center"
  ></div>
  <div *ngIf="fetched" fxLayout="column" fxLayout.gt-sm="row" fxLayoutAlign="space-evenly stretch">
    <div
      *ngIf="fetched"
      fxFlex="40"
      fxLayout="column"
      fxLayoutGap="20px"
      fxLayoutAlign="start center"
    >
      <mat-table [dataSource]="dataSource" class="table-box">
        <ng-container matColumnDef="name">
          <mat-header-cell *matHeaderCellDef> Game name </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{ element.name }} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="player_one_username">
          <mat-header-cell *matHeaderCellDef> Player 1 </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{ element.player_one_username }} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="player_two_username">
          <mat-header-cell *matHeaderCellDef> Player 2 </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{ element.player_two_username }} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="Mode">
          <mat-header-cell *matHeaderCellDef> Mode </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{ getMode(element.is_ranked) }} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="join">
          <mat-header-cell *matHeaderCellDef>
            <mat-icon mat-button class="refresh-icon" color="accent" (click)="refreshList()"
              >refresh</mat-icon
            >
          </mat-header-cell>
          <mat-cell *matCellDef="let row">
            <button mat-button class="hover-button" color="accent" (click)="joinLobby(row)">
              Join
            </button>
          </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row (click)="openLobby(row)" *matRowDef="let row; columns: displayedColumns"></mat-row>
      </mat-table>
    </div>
    <div
      *ngIf="fetched"
      fxLayout="column"
      fxFlexAlign="center"
      fxFlex="20"
      fxLayoutGap="20px"
      fxLayoutAlign="start"
    >
      <div fxLayout="column" fxLayoutGap="15px" class="game-options">
        <h3 class="options-title">New Game</h3>
        
        <mat-slide-toggle 
          [(ngModel)]="isRanked" 
          color="accent"
          class="game-option">
          Ranked game
        </mat-slide-toggle>
        
        <mat-slide-toggle 
          [(ngModel)]="isPrivate" 
          color="accent"
          class="game-option">
          Private game
        </mat-slide-toggle>
        
        <button 
          mat-raised-button 
          color="accent" 
          (click)="createGameWithOptions()"
          class="start-game-button">
          Start Game
        </button>
      </div>
    </div>
  </div>
</div>
