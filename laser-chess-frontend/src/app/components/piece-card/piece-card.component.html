<mat-card appearance="outlined">
  <div class="card-left">
    <h1 class="name">{{ name }}</h1>
    <div class="image">
      @if (image) {
        <img [src]="image" [alt]="name" />
      }
    </div>
  </div>
  <div class="card-right">
    @for (text of description; track text) {
      <p>{{ text }}</p>
    }
  </div>
</mat-card>
